[package]
name = "mlp"
version = "0.2.0"
description = "MLP floating lyrics"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mlp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
base64 = "0.23.1"
tauri-plugin-http = "2"
fontdb = "0.24.0"
# IPADIC is downloaded on demand (Upgrade 17: prebuilt lindera-ipadic from GitHub Releases), not embedded.
lindera = { version = "6.2" }
tauri-plugin-updater = "2"
sha2 = "0.11.1"
getrandom = "0.3"
hex = "0.4.3"
kham-core = "0.8.2"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "multipart"] }
half = { version = "2", optional = true }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

# Windows: GSMTC now-playing, WASAPI capture, Win32 window tricks, DirectML.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_System_WinRT", "Win32_System_Diagnostics_ToolHelp", "Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }
wasapi = "0.27.0"
ort = { version = "2.0.0-rc.15", features = ["directml", "half"], optional = true }

# macOS / Linux (Upgrade 21): MPRIS on Linux; ONNX Runtime on the CPU.
[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2"

[target.'cfg(not(windows))'.dependencies]
ort = { version = "2.0.0-rc.15", features = ["half"], optional = true }

[features]
# ONNX Runtime (CPU + DirectML): vocal isolation (Step 14) and auto-sync (Step 15). On by default since
# Step 18; `--no-default-features` builds a smaller app without them (commands then report "not in this build").
# The exe loads DirectML.dll and the MSVC C++ runtime → the installer puts them next to it (windows/hooks.nsh).
default = ["onnx"]
onnx = ["dep:ort", "dep:half"]
