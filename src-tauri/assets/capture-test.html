<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>MLP timing test</title>
<!-- Step 13 timing test: a short beep at every whole second of "song time". MLP records it through
     the browser, then compares when each beep landed with where it should be. -->
<style>
  body { font: 16px/1.5 system-ui, sans-serif; background: #141318; color: #f1eff5; max-width: 560px; margin: 48px auto; padding: 0 16px; }
  button { font: inherit; padding: 10px 18px; border-radius: 10px; border: 0; background: #ff5a78; color: #fff; cursor: pointer; }
  .dim { color: #9b98a6; }
  #t { font-variant-numeric: tabular-nums; }
</style>
<h1>MLP timing test</h1>
<ol>
  <li>In MLP: Settings → AI listening → turn on <b>Listen to the player</b>.</li>
  <li>Press <b>Start</b> here and leave this tab open (about 50 seconds). It jumps ahead once and pauses once on purpose.</li>
  <li>Back in MLP press <b>Check timing</b>.</li>
</ol>
<button id="go">Start</button>
<p>Song time: <span id="t">0.00</span> s <span id="state" class="dim"></span></p>
<audio id="a"></audio>
<script>
  // 70 s of 22.05 kHz mono: 30 ms 1 kHz beep at every whole second from 1 s.
  const rate = 22050, secs = 70, n = rate * secs;
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVEfmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const t = i / rate, k = Math.floor(t);
    const s = k >= 1 && t - k < 0.03 ? 0.6 * Math.sin(2 * Math.PI * 1000 * t) : 0;
    v.setInt16(44 + i * 2, s * 32767, true);
  }
  const a = document.getElementById("a");
  a.src = URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  navigator.mediaSession.metadata = new MediaMetadata({ title: "MLP timing test", artist: "MLP", album: "Test" });
  let seeked = false, paused = false;
  a.addEventListener("timeupdate", () => {
    document.getElementById("t").textContent = a.currentTime.toFixed(2);
    if (!seeked && a.currentTime > 12) { seeked = true; a.currentTime = 40; }
    if (!paused && a.currentTime > 50) {
      paused = true; a.pause(); document.getElementById("state").textContent = "(paused on purpose)";
      setTimeout(() => { a.play(); document.getElementById("state").textContent = ""; }, 3000);
    }
  });
  a.addEventListener("ended", () => (document.getElementById("state").textContent = "Done — press Check timing in MLP."));
  document.getElementById("go").onclick = () => { seeked = paused = false; a.currentTime = 0; a.play(); };
</script>
</html>
