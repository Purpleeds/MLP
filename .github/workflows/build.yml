# Builds and tests MLP on Windows, macOS and Linux (Upgrade 21), keeps the installers as artifacts and
# publishes the Windows setup .exe as a GitHub Release asset (a direct download, not a zip):
#  - every push to main  -> pre-release "nightly", fixed link:
#      https://github.com/<owner>/<repo>/releases/download/nightly/MLP-nightly-setup.exe
#  - a pushed tag v<version> -> release v<version> (marked latest, feeds the in-app updater):
#      https://github.com/<owner>/<repo>/releases/latest/download/MLP-setup.exe
# Tagged releases need the updater key as repository secrets TAURI_SIGNING_PRIVATE_KEY (contents of
# ~/.tauri/mlp.key) and, if the key has one, TAURI_SIGNING_PRIVATE_KEY_PASSWORD; without them the job
# stops (an unsigned "latest" release without latest.json would break updates). Nightly needs no secrets.
# Release assets are capped at 2 GB per file, so the full AI package (scripts/build-full.mjs, ~4 GB) is
# not published here; the plain installer downloads the AI files on first use.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
          # 24.04: the prebuilt ONNX Runtime needs glibc 2.38+ / GCC 13's libstdc++ (22.04 has 2.35)
          - os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux packages (WebKitGTK, tray, D-Bus for MPRIS)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build app
        shell: bash
        env:
          # ONNX Runtime's macOS objects target 13.4 (also bundle.macOS.minimumSystemVersion)
          MACOSX_DEPLOYMENT_TARGET: "13.4"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          extra=()
          # With the updater key: also write the update signature (setup.exe.sig) for latest.json.
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > "$RUNNER_TEMP/updater.json"
            extra=(--config "$RUNNER_TEMP/updater.json")
          fi
          npx tauri build --bundles ${{ matrix.bundles }} "${extra[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: mlp-${{ matrix.os }}
          path: src-tauri/target/release/bundle
          retention-days: 14

  # Publishes the Windows installer as a release asset. Runs even if the macOS/Linux builds failed; it
  # fails by itself when the Windows build produced no installer.
  publish:
    needs: build
    if: >-
      !cancelled() && github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: mlp-windows-latest
          path: bundle

      - name: Find the installer
        id: files
        run: |
          set -euo pipefail
          version=$(jq -r .version src-tauri/tauri.conf.json)
          setup=$(ls bundle/nsis/*_"$version"_x64-setup.exe | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "setup=$setup" >> "$GITHUB_OUTPUT"
          echo "Installer: $setup ($(du -h "$setup" | cut -f1))"

      - name: Nightly pre-release (main)
        if: github.ref == 'refs/heads/main'
        env:
          SETUP: ${{ steps.files.outputs.setup }}
          VERSION: ${{ steps.files.outputs.version }}
        run: |
          set -euo pipefail
          # A slower, older run must not replace the installer of a newer commit: skip only when the
          # nightly already holds a commit that comes after this one.
          current=$(gh api "repos/$GH_REPO/git/ref/tags/nightly" --jq .object.sha 2> /dev/null || true)
          if [ -n "$current" ] && [ "$current" != "$GITHUB_SHA" ]; then
            order=$(gh api "repos/$GH_REPO/compare/$GITHUB_SHA...$current" --jq .status 2> /dev/null || true)
            if [ "$order" = "ahead" ]; then
              echo "nightly already has the newer commit $current"
              exit 0
            fi
          fi
          mkdir -p out
          cp "$SETUP" out/MLP-nightly-setup.exe
          notes="Automatic build of main at ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d), version $VERSION). Newest changes, not always finished.

          Download **MLP-nightly-setup.exe** below and run it (no admin needed). The installer isn't code-signed yet, so SmartScreen may warn: More info, then Run anyway.

          Stable versions: https://github.com/$GH_REPO/releases/latest"
          # Move the nightly tag to this commit and swap the file. If the tag can't be moved (GitHub refuses
          # that for the Actions token when the commit changes workflow files), make the release again.
          if gh release view nightly > /dev/null 2>&1 &&
             gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true > /dev/null; then
            gh release edit nightly --prerelease --draft=false --title "MLP nightly" --notes "$notes"
            gh release upload nightly out/MLP-nightly-setup.exe --clobber
          else
            gh release delete nightly --cleanup-tag --yes > /dev/null 2>&1 || true
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/nightly" > /dev/null 2>&1 || true
            gh release create nightly out/MLP-nightly-setup.exe --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "MLP nightly" --notes "$notes"
          fi
          echo "https://github.com/$GH_REPO/releases/download/nightly/MLP-nightly-setup.exe"

      - name: Versioned release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SETUP: ${{ steps.files.outputs.setup }}
          VERSION: ${{ steps.files.outputs.version }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [ "$tag" != "v$VERSION" ]; then
            echo "::error::tag $tag doesn't match the app version $VERSION in tauri.conf.json"
            exit 1
          fi
          mkdir -p out
          cp "$SETUP" out/MLP-setup.exe
          if gh release view "$tag" > /dev/null 2>&1; then
            # Made by hand (scripts/release.mjs): keep its signed installer and latest.json, add the fixed-name copy.
            gh release upload "$tag" out/MLP-setup.exe --clobber
            exit 0
          fi
          if [ ! -f "$SETUP.sig" ]; then
            echo "::error::no update signature: add the TAURI_SIGNING_PRIVATE_KEY secret (or publish with scripts/release.mjs)"
            exit 1
          fi
          name=$(basename "$SETUP")
          jq -n --arg v "$VERSION" --arg sig "$(cat "$SETUP.sig")" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/$GH_REPO/releases/download/$tag/$(jq -rn --arg n "$name" '$n|@uri')" \
            '{version: $v, notes: "", pub_date: $date, platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' \
            > out/latest.json
          gh release create "$tag" "$SETUP" "$SETUP.sig" out/latest.json out/MLP-setup.exe \
            --verify-tag --latest --title "MLP $VERSION" --generate-notes
          echo "https://github.com/$GH_REPO/releases/latest/download/MLP-setup.exe"
